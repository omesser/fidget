# CI runs the Rust tests with cargo-nextest, one process per test, so a
# static Mutex cannot keep two tests apart. Tests that share something outside
# the process go in a group of one here.

[test-groups]
# One OS credential store, one `director-api-key` entry: a delete from one
# test would land between another's set and get.
keyring = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(fidget) & test(/^secrets::tests::/)'
test-group = 'keyring'

# nextest starts tests in binary order, so fidget-verify's PowerShell scenario
# tests (up to 20 s each on Windows) would start last and run alone.
[[profile.default.overrides]]
filter = 'package(fidget-verify)'
priority = 100

[profile.ci]
# Report every failure, not just the first, and list the slow tests last.
fail-fast = false
slow-timeout = { period = "30s" }
final-status-level = "slow"
