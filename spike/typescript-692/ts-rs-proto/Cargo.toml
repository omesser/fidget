[package]
name = "ts-rs-proto"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Only tests derive `TS`, so the shipped binary would carry none of this.
[dev-dependencies]
ts-rs = { version = "11", features = ["serde-compat", "serde-json-impl"] }
