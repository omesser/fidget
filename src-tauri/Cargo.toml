[package]
name = "fidget"
description = "A desktop companion that lives on your screen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "fidget"
path = "src/lib.rs"

[[bin]]
name = "fidget"
path = "src/main.rs"

[build-dependencies]
tauri-build = {version = "2", features = []}

[dependencies]
tauri = {version = "2", features = ["macos-private-api", "tray-icon"]}
# Signed updates from GitHub Releases. WindowPet's updater shape, our endpoint.
tauri-plugin-updater = "2"
fidget-core = {path = "../crates/core"}
fidget-mcp-server = {path = "../crates/mcp-server"}
serde = {version = "1", features = ["derive"]}
# Character Package art reaches the webview as `data:` URLs; `src/cast.rs` says
# why.
base64 = "0.23"
# Reading a Character Package that was shipped as an archive. Zip because it is
# what Finder's "Compress" produces, and a central-directory parser over
# untrusted input is not something to hand-roll. `deflate-flate2` rather than
# the umbrella `deflate` feature: it reuses the flate2 already here under `png`,
# where the umbrella also drags in zopfli, a compressor only a writer needs.
zip = {version = "8.6", default-features = false, features = ["deflate-flate2"]}
# The hotkey that hides and shows the Character. Tauri has no global shortcut
# of its own — this is its first-party plugin — and the alternative is an
# AppKit global event monitor, which needs Accessibility consent that DESIGN.md
# decision 9 refuses to ask for. Carbon's `RegisterEventHotKey` underneath
# prompts for nothing.
tauri-plugin-global-shortcut = "2"
# Sync HTTP for the model Director. A worker thread posts; the frame loop
# does not wait. ureq instead of reqwest: no tokio.
ureq = {version = "3", features = ["json"]}
serde_json = "1"
# Reading a base URL: whether it is served from this machine decides whether a
# key is optional, so the host is a security question and not a string to split
# on `://` by hand. Already in the tree through the crates above; this only
# names the edge.
url = "2"
# The official ACP SDK. The attached Harness is spoken to over it (ADR-0022).
# Its futures need an executor, and that executor lives on one thread in
# `acp_wire.rs`: a current-thread tokio runtime, `rt` + `sync` + `macros` and
# nothing more. tokio was already in the tree through Tauri. The frame loop
# never sees a future (ADR-0004).
agent-client-protocol = "2.1"
# Log rotation for the Action Log and the process log: K=10 retention
# (10 rotated + 1 current), 2 MB per file, ~22 MB ceiling. BytesSurpassed
# keeps a line whole.
file-rotate = "0.8"
tokio = {version = "1", features = ["rt", "sync", "macros"]}
# How the SDK reads a child's pipes. Spawned by us rather than by the SDK's
# `AcpAgent`, which has no working-directory knob; attach cwd is a setting
# (#782). The data folder holds the session file and Action Log.
async-process = "2"
# The trait the SDK reads a child's stdout through, so the wire can copy what
# a launcher printed before `initialize` without reading it itself.
futures-io = "0.3"
# Ctrl+C from `cargo run` must shut the Harness down on a dedicated thread:
# a signal handler itself cannot take the mutex `shutdown` needs. Isolation
# (own process group) waits until this catch is installed, so a failed
# handler leaves the child in the app group where the signal still reaps it.
ctrlc = "3"
# The OS secret store is how the Director key survives `cargo run` without
# landing in `settings.json`.
keyring = {version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"]}
# PNG decoding for the tray icon.
image = {version = "0.25", default-features = false, features = ["png"]}
# The bearer token for the loopback MCP server (ADR-0023). The OS CSPRNG and
# nothing else: already in the tree under keyring and tokio, and a token minted
# from a clock is a token an attacker can guess.
getrandom = "0.4"

[target.'cfg(unix)'.dependencies]
# Process-group teardown for an `npx` Harness: `getpgid` / `killpg`.
libc = "0.2"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# X11 for Linux: window list, pointer state, EWMH properties, idle time.
# x11rb is pure Rust, maintained, and wraps the protocol at a level that
# gives both raw access and type-safe helpers.
x11rb = {version = "0.14", features = ["allow-unsafe-code", "shape", "dpms", "screensaver", "xinput"]}
# Raw window handle for getting the X11 window id from Tauri.
raw-window-handle = "0.6"
# Cast atom arrays to bytes for X11 property changes.
bytemuck = "1.16"
# GTK 3 for overlay raise, pointer interval, and WebKitGTK. Tauri 2 uses GTK 3,
# so this adds no second GTK major version.
gtk = "0.18"
# The Linux taskbar anchor is a GTK window. Pixbuf is how that window takes
# the same PNG the bundle uses as its icon.
gdk-pixbuf = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
# xdg-desktop-portal consent: ScreenCast for Wayland titles (#886).
# tokio feature reuses the tokio already here under async-process / ACP SDK.
ashpd = {version = "0.13", features = ["tokio", "screencast"]}

[target.'cfg(windows)'.dependencies]
# ShellExecuteW opens a file with the default application as a wide-string
# parameter. The previous `cmd /C start` arm re-parsed `&` and `%` (#255).
# Job Object for Harness process tree teardown: grandchildren die with us.
# Extended startup info for create-time job association (#517).
# GetModuleHandleW names the module that owns the taskbar anchor window class.
windows-sys = {version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Pipes",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
]}
# Raw window handle for getting the HWND from Tauri.
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
# The context menu (#155) is not here: `tauri::menu` already wraps the menu
# library Tauri ships with, so naming it again would put a second copy of it in
# the tree — and on Linux the copy is what dragged in libxdo.
objc2 = "0.6"
objc2-app-kit = {version = "0.3", features = [
  "NSWindow",
  "NSPanel",
  "NSResponder",
  "NSApplication",
  # Which application the user is in. Reports the application only — no window,
  # no title — so nothing here is gated by Screen Recording.
  "NSWorkspace",
  "NSRunningApplication",
  "NSImage",
  "NSStatusItem",
  "NSStatusBarButton",
  "NSEvent"
]}
# The window list and the display list. Both crates are already compiled as
# dependencies of objc2-app-kit; naming them here declares what we call
# directly rather than pulling anything new in. The alternative is hand-written
# `extern "C"` declarations of the same CoreGraphics symbols.
#
# `default-features = false` throughout: these crates default to binding whole
# frameworks, which drags in Metal for a window list.
# AXIsProcessTrusted and the prompt-option key. The hand-written
# `extern "C"` declarations these replace typed the return as Rust `bool`;
# ApplicationServices returns a one-byte `Boolean`, so the crate's `!= 0` is a
# correctness fix, not only one fewer declaration. #696.
objc2-application-services = {version = "0.3", default-features = false, features = [
  "std",
  "objc2",
  "HIServices",
  "AXUIElement"
]}
objc2-core-foundation = {version = "0.3", default-features = false, features = [
  "std",
  "CFCGTypes",
  "CFDictionary",
  # The AX prompt option: a CFString key against a CFBoolean value.
  "CFNumber",
  "CFString",
  # The mouse event tap: `CGEventTapCreate` hands back a Mach port, and a tap
  # only delivers while a run loop owns its source (#721).
  "CFMachPort",
  "CFRunLoop"
]}
objc2-core-graphics = {version = "0.3", default-features = false, features = [
  "std",
  "objc2",
  "CGDirectDisplay",
  "CGError",
  "CGGeometry",
  "CGWindow",
  # How long since the last input event. A count of seconds, not the events.
  "CGEventSource",
  # The opt-in mouse event tap and the Input Monitoring grant it needs:
  # `CGEventTapCreate`, `CGEventTapEnable`, and the preflight/request pair
  # (#721). Reading the events themselves is what the grant buys.
  "CGEvent",
  "CGEventTypes"
]}
objc2-foundation = {version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSDictionary",
  "NSEnumerator",
  "NSString",
  "NSUserDefaults",
  "NSValue",
  "NSURL",
  # A Chat window's miniaturize notifications. Tauri has no minimize event.
  "NSNotification",
  "NSOperation",
  "block2"
]}
# The notification observer's callback. Already in the tree under objc2-foundation.
block2 = "0.6"

[dev-dependencies]
uuid = {version = "1.11", features = ["v4"]}
