[package]
name = "fidget-core"
description = "fidget's pure core: engine, character packages, memory, and the adapter traits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
png = "0.18"
# Parse only: the loader reads manifests and never writes one, and serde would
# put its error strings where the Character-Manifest ones belong.
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
uuid = { version = "1.11", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Known OS data directories. Not a window-server binding: Memory lives in
# Application Support so a reboot does not wipe what the characters know. #18.
dirs = "7"

# Local civil time for the Free tier. One `localtime_r` call. Not a
# window-server binding; Windows is out of v1 and does not use this.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
