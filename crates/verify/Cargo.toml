[package]
name = "fidget-verify"
description = "Agent/CI verify entry: doctor, units, overlay, poke, summon, cleanup (ADR-0027)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "fidget-verify"
path = "src/main.rs"

[dependencies]
clap = {version = "4", features = ["derive"]}
fidget-core = {path = "../core"}
# `--json` is a contract other tools parse, so the object is serialised rather
# than formatted: a Windows evidence path or a quoted detail string must not be
# able to produce something that does not parse.
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
# Pure Rust today, and nothing about what this crate does needs FFI. `forbid`
# rather than `deny` so the guarantee cannot be turned off one `#[allow]` at a
# time: adding `unsafe` here should be a conversation, not a local override.
unsafe_code = "forbid"
