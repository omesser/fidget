# The split docs/SPEC.md describes: a core crate that depends on no platform
# binding, and a shell that does. `cargo tree -p fidget-core` is the check.

[workspace]
resolver = "2"
members = ["crates/core", "crates/mcp-server", "crates/verify", "src-tauri"]

[workspace.package]
version = "0.9.0"
edition = "2021"
# 1.95 stabilizes `AtomicUsize::try_update`, the name clippy wants on stable.
# The ACP crates (ADR-0022) need 1.88.
rust-version = "1.95"
license = "MIT"

# Unoptimized PNG decoding of every installed Character adds 1-2 s to a debug
# launch on a CI runner, which pushes it past the scenario leaves' 3 s wait.
# Only the decoder's crates, so a clean dev build costs no more.
[profile.dev.package]
adler2.opt-level = 3
crc32fast.opt-level = 3
fdeflate.opt-level = 3
flate2.opt-level = 3
miniz_oxide.opt-level = 3
png.opt-level = 3
simd-adler32.opt-level = 3
