# Run `pre-commit install` once after cloning.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    # Git style
      - id: check-merge-conflict
      - id: check-vcs-permalinks
      - id: forbid-new-submodules

    # Common errors. `*vendored` keeps fixers off byte-identical upstream files
    # (vendored skills, marked.esm.js's pinned hash) and generated or binary
    # paths. The lookahead keeps our own `verify-fidget` linted.
      - id: end-of-file-fixer
        exclude: &vendored ^((.*/)?Cargo\.lock|.*\.png|.*\.b64|branding/_b64/parts/.*|src/vendor/marked\.esm\.js)$|^\.agents/(agents/|pstack/(SKILLS\.md|LICENSE)|skills/(?!verify-fidget/))
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: *vendored
      # ast-grep rule and test files are `---`-separated streams.
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
        exclude: (^|/)Cargo\.lock$
      - id: check-executables-have-shebangs

    # Cross platform
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: *vendored

  # Hooks that must see every file, vendored ones included, in their own
  # block so an edit to the excludes above cannot reach them.
  # `tests/pre-commit-scans-everything.test.js` holds the line.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']
      - id: check-added-large-files

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        additional_dependencies: ["tomli"]
        # "crate" is Rust vocabulary, not a misspelling of "create".
        # "static" is Win32 control class vocabulary (STATIC); codespell flags STATICs/Statics as "statistics".
        # "sigit" is an agent id in the ACP registry, not a misspelling of "digit".
        args: ["--ignore-words-list=crate,crates,static,statics,sigit"]
        exclude: *vendored

  # Comment block ceiling, from `scripts/ast-grep/rules/`. Snapshot tests are
  # skipped: the valid/invalid verdict is the whole assertion.
  - repo: https://github.com/boidolr/ast-grep-pre-commit
    rev: 0.45.3
    hooks:
      - id: ast-grep
        exclude: *vendored
      - id: ast-grep-rule-tests
        args: [--skip-snapshot-tests]

  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.14.0
    hooks:
      # Pinned: floating toml-sort and tomlkit versions disagree on
      # inline-table spacing, so CI reformats files a local env passes.
      - id: pretty-format-toml
        args: [--autofix, --no-sort]
        additional_dependencies: ["toml-sort==0.24.4", "tomlkit==0.15.1"]
        exclude: (^|/)Cargo\.lock$
      - id: pretty-format-yaml
        args: [--autofix, --indent, '2', '--offset', '2', --preserve-quotes]

    # Shell formatting and check
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: shfmt
        args: ['-l', '-i', '2', '-ci', '-sr', '-w']
        exclude: *vendored
      - id: shellcheck
        exclude: *vendored

    # PowerShell linting
  - repo: local
    hooks:
      - id: psscriptanalyzer-check
        name: PSScriptAnalyzer
        # Skips without pwsh, or when Darwin pwsh crashes; Linux CI lints.
        entry: scripts/hooks/psscriptanalyzer.sh
        language: system
        files: \.ps1$
        # The script gates Error and ParseError (a syntax fault). Encoding is a
        # Warning; the hook below holds that policy.

      # Not the analyzer's rule: it prescribes a BOM, itself non-ASCII.
      - id: powershell-ascii-only
        name: PowerShell scripts are ASCII-only
        language: pygrep
        entry: '[^\x00-\x7F]'
        # Case-insensitive: Windows does not distinguish `.PS1`.
        files: (?i)\.ps1$

    # Swift (macOS only; skipped on Linux CI)
  - repo: local
    hooks:
      - id: swiftc-typecheck
        name: swiftc typecheck (macOS only)
        # One file at a time: top-level code is only legal in a single-file
        # compilation.
        entry: bash -c 'if [ "$(uname -s)" != Darwin ]; then echo "skipped - swiftc ships with Xcode"; exit 0; fi; for f in "$@"; do swiftc -typecheck "$f" || exit 1; done' --
        language: system
        types: [swift]

    # Rust
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        args: [--check]
        language: system
        types: [rust]
        pass_filenames: false

      # Parallel branches pick the same next ADR number, and a citation like
      # "ADR-0007" becomes ambiguous.
      - id: adr-numbers-unique
        name: ADR numbers are unique
        entry: bash -c 'twice=$(ls docs/adr | grep -oE "^[0-9]{4}" | sort | uniq -d); if [ -n "$twice" ]; then echo "ADR number used more than once - $twice"; exit 1; fi' --
        language: system
        files: ^docs/adr/
        pass_filenames: false

      # Evidence can end up on a public PR, and a whole display is the
      # owner's desktop. Capture a window (-l) or a region (-R).
      - id: screencapture-is-cropped
        name: screencapture takes a window or a region
        entry: '(^\s*|[;&|({]\s*)screencapture\b(?![^\n]*\s-[lR]\b)'
        language: pygrep
        types: [shell]

      # Ungated on purpose (#321): a missing window-layer library fails here
      # rather than a skip claiming the shell was checked.
      - id: cargo-clippy
        name: cargo clippy (workspace)
        entry: cargo clippy --workspace --all-targets --
        args: [-D, warnings]
        language: system
        types: [rust]
        pass_filenames: false
