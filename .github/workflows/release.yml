name: Release

on:
  release:
    types: [published]
  # checkov:skip=CKV_GHA_7:string dispatch inputs reach the shell through env and must match semver before use
  workflow_dispatch:
    inputs:
      version-override:
        description: 'Stamp this version on the bundles. Leave empty to use the tag on the chosen commit, else <latest tag>-dev.g<sha>.'
        type: string
        required: false
        default: ''
      linux:
        description: 'Build Linux bundles'
        type: boolean
        required: false
        default: true
      macos:
        description: 'Build macOS bundles'
        type: boolean
        required: false
        default: true
      windows:
        description: 'Build Windows bundles'
        type: boolean
        required: false
        default: true
      sync-tap-tag:
        description: 'Sync tap tag. Recovery only. A published Release tag such as v1.2.3. Leave empty for a package build that does not touch Homebrew.'
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

jobs:
  # A Release run attaches bundles to the human-published Release and never
  # creates one. Platforms are picked in a job because a job-level `if:`
  # cannot name the matrix.
  plan:
    if: github.event_name != 'workflow_dispatch' || inputs['sync-tap-tag'] == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        env:
          RELEASE: ${{ github.event_name == 'release' }}
          LINUX: ${{ inputs.linux }}
          MACOS: ${{ inputs.macos }}
          WINDOWS: ${{ inputs.windows }}
        run: |
          entries=()
          wanted() { [ "$RELEASE" = true ] || [ "$1" = true ]; }
          wanted "$MACOS"   && entries+=('{"os":"macos-latest","bundles":"dmg","key":"macos"}')
          wanted "$LINUX"   && entries+=('{"os":"ubuntu-latest","bundles":"appimage,deb","key":"linux"}')
          wanted "$WINDOWS" && entries+=('{"os":"windows-latest","bundles":"nsis","key":"windows"}')
          if [ ${#entries[@]} -eq 0 ]; then
            echo "::error::no platform selected: tick at least one of linux, macos, windows"
            exit 1
          fi
          printf 'matrix={"include":[%s]}\n' "$(IFS=,; echo "${entries[*]}")" >> "$GITHUB_OUTPUT"

  package:
    needs: plan
    if: github.event_name != 'workflow_dispatch' || inputs['sync-tap-tag'] == ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version comes from tags. Not fetch-depth: 0, the history is
          # ~900 MB.
          fetch-tags: true

      - name: The version that ships
        # git names the version, never tauri.conf.json. With no override or
        # tag on the commit, <latest tag>-dev.g<sha> reads as "after that
        # release", and the SHA keeps two dev bundles off one filename.
        id: ver
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
          # Bracket syntax, not inputs.version-override: an expression reads
          # the hyphen as subtraction and yields nothing.
          OVERRIDE: ${{ inputs['version-override'] }}
        run: |
          version="${OVERRIDE#v}"
          if [ -z "$version" ]; then
            [ -n "$TAG" ] || TAG=$(git tag --points-at HEAD --sort=-v:refname | head -n 1)
            if [ -n "$TAG" ]; then
              version="${TAG#v}"
            else
              base=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
              base="${base#v}"
              version="${base:-0.0.0}-dev.g$(git rev-parse --short=7 HEAD)"
            fi
          fi
          # `=~`, not grep: grep matches per line, so a two-line override
          # would smuggle its second line into GITHUB_OUTPUT.
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! $version =~ $semver ]]; then
            echo "::error::version '$version' is not semver: expected 1.2.3 or v1.2.3, 1.2.3-dev.gabc1234"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building \`$version\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .
          key: release-${{ matrix.os }}
          cache-on-failure: true

      - name: Install the Linux system packages
        # patchelf is what the AppImage bundler patches with. The .deb's
        # Depends follows the appindicator linked here, and docs/DEVELOPMENT.md
        # promises ayatana: libappindicator3-dev would silently change it.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev

      - name: Set up Node
        # tauri-action installs @tauri-apps/cli through npm.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'

      - name: Build the packages
        # Empty release inputs tell the action there is no Release to attach
        # to. No signing secrets: createUpdaterArtifacts is false until #200,
        # and signingIdentity "-" is ad-hoc.
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          releaseId: ${{ github.event.release.id }}
          tagName: ${{ github.event.release.tag_name }}
          uploadWorkflowArtifacts: true
          args: --bundles ${{ matrix.bundles }} --config '{"version":"${{ steps.ver.outputs.version }}"}'

  homebrew:
    needs: package
    if: |
      always() &&
      !cancelled() &&
      (
        (
          github.event_name == 'release' &&
          github.event.release.prerelease == false &&
          needs.package.result == 'success'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs['sync-tap-tag'] != '' &&
          needs.package.result == 'skipped'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs['sync-tap-tag'] }}
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Require the tap deploy key
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$HOMEBREW_TAP_DEPLOY_KEY" ]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY is empty. The Release cannot push omesser/homebrew-fidget."
            exit 1
          fi

      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Install ruby and 7z
        run: sudo apt-get update && sudo apt-get install -y ruby p7zip-full

      - name: Bump and verify the cask
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          version="${TAG#v}"
          if [[ ! $version =~ $semver ]]; then
            echo "::error::tag '$TAG' is not a release tag"
            exit 1
          fi
          scripts/bump-homebrew-cask.sh "$TAG"
          scripts/verify-homebrew-cask.sh

      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: omesser/homebrew-fidget
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: homebrew-tap
          fetch-depth: 1

      - name: Push the cask and the tap
        id: canonical
        run: |
          set -euo pipefail
          bash scripts/publish-homebrew-cask.sh --tag "$TAG" --tap homebrew-tap --branch "$BRANCH" --tap-branch main \
            | tee /tmp/homebrew-publish.txt
          if grep -q '^canonical_status=pull-request$' /tmp/homebrew-publish.txt; then
            echo "pull_request=true" >> "$GITHUB_OUTPUT"
            sed -n 's/^canonical_branch=/branch=/p' /tmp/homebrew-publish.txt >> "$GITHUB_OUTPUT"
          else
            echo "pull_request=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo '### Homebrew'
            echo
            cat /tmp/homebrew-publish.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the cask pull request
        if: always() && !cancelled() && steps.canonical.outputs.pull_request == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BRANCH: ${{ steps.canonical.outputs.branch }}
        run: |
          case "$PR_BRANCH" in
            ''|*[!A-Za-z0-9._/-]*)
              echo "::error::refusing to open a pull request for '$PR_BRANCH'"
              exit 1
              ;;
          esac
          title="build: Bump the Homebrew cask to ${TAG}"
          {
            echo '## Why'
            echo
            echo "The ${TAG} Release bumped packaging/homebrew/Casks/fidget.rb. The default branch requires a pull request, so this branch carries the cask."
            echo
            echo 'The tap omesser/homebrew-fidget is pushed from the same job and does not wait on this pull request.'
            echo
            echo '## How to verify'
            echo
            echo 'The Release job ran scripts/verify-homebrew-cask.sh before this commit.'
          } > /tmp/homebrew-pr.md
          if gh pr view "$PR_BRANCH" --json number --jq .number > /dev/null 2>&1; then
            gh pr edit "$PR_BRANCH" --title "$title" --body-file /tmp/homebrew-pr.md
          else
            gh pr create --base "$BRANCH" --head "$PR_BRANCH" \
              --title "$title" --body-file /tmp/homebrew-pr.md
          fi
