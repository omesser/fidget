name: Security

# Advisory databases change under an untouched lockfile, so the nightly run is
# what surfaces a new advisory; pull requests and main get the same audits.
# Secret scanning is its own workflow, secret-scanning.yml.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Reads Cargo.lock only, so the project is not built.
  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find the latest cargo-audit
        id: cargo-audit
        # Unpinned on purpose: each release is picked up without a bump, at the
        # cost of no checksum. crates.io refuses requests without a User-Agent.
        run: |
          version=$(curl -fsSL -A "fidget-ci (https://github.com/omesser/fidget)" \
            https://crates.io/api/v1/crates/cargo-audit | jq -r '.crate.max_stable_version')
          if [ -z "$version" ] || [ "$version" = null ]; then
            echo "::error::crates.io returned no cargo-audit version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache cargo-audit
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ steps.cargo-audit.outputs.version }}

      - name: Install cargo-audit
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.cargo-audit.outputs.version }}
        run: cargo install cargo-audit --locked --version "$VERSION"

      - name: Cargo audit
        run: cargo audit

  # Reads package-lock.json only; nothing is installed.
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'

      - name: npm audit
        run: npm audit --audit-level=high
