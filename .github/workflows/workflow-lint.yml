name: Workflow Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck
        # actionlint's shellcheck integration needs the binary on PATH.
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install actionlint and zizmor
        # Both are release tarballs with checksums. A third-party action is
        # not used: the repo's Actions allowlist would reject it.
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 # pragma: allowlist secret
          ZIZMOR_VERSION: '1.32.0'
          ZIZMOR_SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b # pragma: allowlist secret
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint

          curl -fsSL -o "$RUNNER_TEMP/zizmor.tgz" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ZIZMOR_SHA256  $RUNNER_TEMP/zizmor.tgz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/zizmor.tgz" -C "$RUNNER_TEMP" zizmor

          sudo mv "$RUNNER_TEMP/actionlint" "$RUNNER_TEMP/zizmor" /usr/local/bin/
          actionlint -version
          zizmor --version

      - name: Run actionlint
        run: actionlint -color

      - name: Run zizmor
        run: zizmor --offline --config .github/zizmor.yml .github/workflows
