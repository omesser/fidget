name: Matt Pocock Skills Sync

# Re-vendors `.agents/mattpocock/` from `mattpocock/skills@main:skills/engineering`
# weekly. It never merges: third-party agent instructions land only through review.

on:
  schedule:
    # After the pstack sync, whose UPSTREAM.json names the skills this one
    # must skip.
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  # `actions: write` is for dispatching PR Tests at the sync branch.
  contents: write
  pull-requests: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        # The tests run here because a pull request opened with GITHUB_TOKEN
        # does not trigger PR Tests; the dispatched run reports on the branch.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'

      - name: Record the vendored commit
        id: before
        run: |
          sed -n 's/.*"commit": *"\([^"]*\)".*/before=\1/p' \
            .agents/mattpocock/UPSTREAM.json >> "$GITHUB_OUTPUT"

      - name: Re-vendor from upstream
        run: scripts/sync-mattpocock.sh --fetch

      - name: Decide whether upstream moved
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
            echo "Already at the upstream head. Nothing to open."
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Layout and ownership tests
        # `.agents/skills` is shared with pstack; ownership proves the script
        # skipped a name pstack already owns.
        if: steps.changes.outputs.moved == 'true'
        run: node --test tests/skills-layout.test.js tests/skills-ownership.test.js

      - name: Push the sync branch
        if: steps.changes.outputs.moved == 'true'
        id: push
        run: |
          after=$(sed -n 's/.*"commit": *"\([^"]*\)".*/\1/p' .agents/mattpocock/UPSTREAM.json)
          echo "after=$after" >> "$GITHUB_OUTPUT"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Explicit path, so a stray runner file is not committed.
          git add .agents
          # Before the commit: the shallow checkout has no `HEAD~1` after it.
          git diff --cached --stat | tail -40 > /tmp/mattpocock-diffstat.txt
          git commit -m "chore(mattpocock): Sync vendored skills to ${after:0:12}"
          # An explicit lease, because the shallow checkout has no
          # remote-tracking ref. Empty means "expect no branch yet".
          lease=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          git push --force-with-lease="refs/heads/$BRANCH:$lease" \
            origin "HEAD:$BRANCH"
        env:
          BRANCH: chore/mattpocock-sync

      - name: Open or update the pull request
        if: steps.changes.outputs.moved == 'true'
        run: |
          {
            echo '## Why'
            echo
            echo '`.agents/mattpocock/` tracks `mattpocock/skills@main:skills/engineering`, and upstream moved.'
            echo
            echo '## What changed'
            echo
            echo "Vendored commit \`$BEFORE\` to \`$AFTER\`."
            echo
            echo "Upstream range: https://github.com/mattpocock/skills/compare/$BEFORE...$AFTER"
            echo
            echo '```'
            cat /tmp/mattpocock-diffstat.txt
            echo '```'
            echo
            echo 'Check the `excluded` block in `.agents/mattpocock/UPSTREAM.json` against the job log. A skill upstream added under a name pstack already owns is skipped, not vendored, and the log line says which.'
            echo
            echo '## How to verify'
            echo
            echo '`node --test tests/skills-layout.test.js tests/skills-ownership.test.js` ran green on this branch before this pull request opened, and the full `PR Tests` suite was dispatched at the branch straight afterwards.'
            echo
            echo "That dispatched run is a standalone run, not a status check: no \`PR Tests\` tick will appear on this pull request, however green the suite came out. Read it before approving: https://github.com/$GH_REPO/actions/workflows/tests.yml?query=branch%3A${BRANCH//\//%2F}"
            echo
            echo 'A pull request opened with `GITHUB_TOKEN` does not trigger `on: pull_request`, which is why the suite has to be dispatched and why it cannot report here. If the dispatch itself failed, this job logged an error and the branch carries only the two tests above — run `node --test tests/` and `pre-commit run --all-files` locally before approving.'
            echo
            echo 'Read `docs/agents/vendored-skills.md` before approving a change to a playbook this repository overrules.'
          } > /tmp/mattpocock-pr.md

          title="chore(mattpocock): Sync vendored skills to ${AFTER:0:12}"
          # Check for an open PR on this head; `gh pr view` matches merged PRs too.
          if gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' | grep -q .; then
            gh pr edit "$BRANCH" --title "$title" --body-file /tmp/mattpocock-pr.md
          else
            # No label: docs/agents/triage-labels.md labels issues, not pull
            # requests. No auto-merge.
            gh pr create --base "$GITHUB_BASE" --head "$BRANCH" \
              --title "$title" --body-file /tmp/mattpocock-pr.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITHUB_BASE: main
          BRANCH: chore/mattpocock-sync
          BEFORE: ${{ steps.before.outputs.before }}
          AFTER: ${{ steps.push.outputs.after }}

      - name: Dispatch the full test suite at the sync branch
        if: steps.changes.outputs.moved == 'true'
        # Last, and unable to fail the job: the pull request is worth keeping
        # without the run, and its body says what to do when the run is missing.
        run: |
          gh workflow run tests.yml --ref "$BRANCH" ||
            echo "::error::Could not dispatch PR Tests for $BRANCH." \
              "The sync pull request stands, verified only by the two tests above."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: chore/mattpocock-sync
