name: PR Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  # The token only checks out and queries mvdan/sh releases. changed-files
  # diffs the local `.git`, so it needs no `pull-requests` scope.
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  # Keep an in-flight run when the `windows` label fires `labeled`.
  cancel-in-progress: ${{ github.event.action != 'labeled' }}

jobs:
  # One job, both platforms: they differ only in tool installation. Linux is
  # built too because platform.rs carries a non-macOS arm for every decision.
  checks:
    if: github.event.action != 'labeled' || github.event.label.name == 'windows'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Linux only. The URI hash and the install both read this, so the
      # cache key cannot name a different set from the one apt fetches.
      APT_PACKAGES: >-
        libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
        libayatana-appindicator3-dev shellcheck gnome-keyring

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Find what this run changed
        id: changed
        # `files_ignore` lists what is not code, so an unanticipated file type,
        # this workflow included, counts as code and cannot switch itself off.
        # Every action is SHA-pinned; this one's tags were repointed (CVE-2025-30066).
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        continue-on-error: true
        with:
          files_ignore: |
            **/*.md
            LICENSE

      - name: Decide whether this run touches code
        id: changes
        # Fails open: only a pull request whose changed files were all ignored
        # skips. A broken changed-files step, a dispatch or a push runs in full.
        env:
          ANY_CHANGED: ${{ steps.changed.outputs.any_changed }}
          OUTCOME: ${{ steps.changed.outcome }}
        run: |
          code=true
          if [ "$OUTCOME" = success ] && [ "$ANY_CHANGED" = false ] &&
            [ "${{ github.event_name }}" = pull_request ]; then
            code=false
          fi
          echo "touches code: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Rust
        if: steps.changes.outputs.code == 'true'
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Cache cargo build
        if: steps.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .
          key: ${{ matrix.os }}
          # A red run is the one about to be pushed again; keep its cache warm.
          cache-on-failure: true

      - name: Install shfmt
        # jq, not a regex: POSIX ERE has no lazy `.+?`, so a regex over the JSON
        # matches kilobytes. Authenticated, because hosted runners share the
        # 60-an-hour anonymous API limit and the query 403s at random.
        if: steps.changes.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$(uname -s)_$(uname -m)" in
            Linux_x86_64)  asset=_linux_amd64 ;;
            Linux_aarch64) asset=_linux_arm64 ;;
            Darwin_arm64)  asset=_darwin_arm64 ;;
            Darwin_x86_64) asset=_darwin_amd64 ;;
            *) echo "no shfmt asset known for $(uname -s) $(uname -m)"; exit 1 ;;
          esac
          url=$(curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/mvdan/sh/releases/latest \
            | jq -r --arg asset "$asset" \
              '.assets[] | select(.name | endswith($asset)) | .browser_download_url')
          if [ -z "$url" ]; then
            echo "no shfmt release asset ending in $asset"; exit 1
          fi
          curl -fsSL --retry 3 --retry-all-errors -o shfmt "$url"
          chmod +x shfmt && sudo mv shfmt /usr/local/bin/
          shfmt --version

      - name: Install shellcheck
        # Linux gets shellcheck from apt below, so apt updates once.
        # No auto-update: it refreshes every formula before this install.
        # Caching the bottle costs more than the few seconds it takes to fetch.
        if: runner.os == 'macOS' && steps.changes.outputs.code == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install shellcheck

      - name: Resolve the Linux package URIs
        # The URI list is the lockfile, so apt-get update runs before the cache key.
        if: runner.os == 'Linux' && steps.changes.outputs.code == 'true'
        id: apt
        run: |
          # Drop the image's Chrome apt source: nothing below needs it, and a bad
          # index there fails `apt-get update`. Matched by URL because its file
          # name has changed before.
          sudo find /etc/apt/sources.list.d -type f \
            -exec grep -lE 'dl\.google\.com' {} + 2>/dev/null \
            | sudo xargs -r rm -vf
          sudo apt-get update
          read -r -a packages <<< "$APT_PACKAGES"
          sudo apt-get install --print-uris -y "${packages[@]}" >"$RUNNER_TEMP/apt-uris"
          uris=$(grep "^'" "$RUNNER_TEMP/apt-uris" || true)
          if [ -z "$uris" ]; then
            echo "apt printed no package URIs"
            exit 1
          fi
          echo "hash=$(printf '%s\n' "$uris" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache apt archives
        # Archives only. Unpacking still happens, and the action cannot read
        # root's apt cache. The key is this install's URIs, so a new deb misses
        # and the previous archives restore.
        if: runner.os == 'Linux' && steps.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt/archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.apt.outputs.hash }}
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-

      - name: Install the Linux system packages
        # gnome-keyring is the Secret Service the KeyringStore tests reach.
        if: runner.os == 'Linux' && steps.changes.outputs.code == 'true'
        run: |
          # The image may delete archives after install. The cache is those debs.
          mkdir -p "$HOME/.cache/apt/archives/partial"
          read -r -a packages <<< "$APT_PACKAGES"
          sudo apt-get \
            -o "Dir::Cache::archives=$HOME/.cache/apt/archives" \
            -o APT::Keep-Downloaded-Packages=true \
            install -y "${packages[@]}"
          # apt writes these as root. The cache action runs as the runner, and
          # tar refuses a directory it cannot list. partial is an in-flight download.
          sudo chown -R "$USER" "$HOME/.cache/apt/archives"
          rm -rf "$HOME/.cache/apt/archives/partial"
          rm -f "$HOME/.cache/apt/archives/lock"

      - name: Cache the pre-commit hook environments
        # pythonLocation carries the patch version, which a virtualenv is bound
        # to; '3.12' alone would restore envs pointing at a missing interpreter.
        # No restore-keys: a near-miss would restore a stale config's envs.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        # Runs on docs-only changes too; SKIP drops only the hooks whose
        # toolchain was not installed. macOS-only hooks check uname themselves.
        env:
          SKIP: ${{ steps.changes.outputs.code == 'false' && 'cargo-fmt,cargo-clippy,shfmt,shellcheck' || '' }}
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: Core crate reaches no platform binding
        # --target all: a cfg(target_os)-gated dependency is invisible to a
        # host-only tree.
        if: steps.changes.outputs.code == 'true'
        run: |
          tree=$(cargo tree -p fidget-core --target all)
          if echo "$tree" | grep -qE '\b(tauri|objc2)'; then
            echo "core reaches a platform binding:"; echo "$tree"; exit 1
          fi

      - name: Rust tests
        # --doc too: --all-targets skips doctests.
        if: steps.changes.outputs.code == 'true'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- bash -lc '
              set -euo pipefail
              echo "" | gnome-keyring-daemon --unlock || true
              eval "$(gnome-keyring-daemon --start --components=secrets)"
              cargo test --all-targets
              cargo test --doc
            '
          else
            cargo test --all-targets
            cargo test --doc
          fi
        env:
          RUNNER_OS: ${{ runner.os }}

  # Own job: no node test depends on the OS, and only Ubuntu ships the Chrome the
  # headless renderer tests drive. Without Rust or apt it finishes beside `checks`.
  # Like `checks`, it skips a pull request that changes only Markdown and LICENSE.
  renderer:
    if: github.event.action != 'labeled' || github.event.label.name == 'windows'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Find what this run changed
        id: changed
        # `files_ignore` lists what is not code, so an unanticipated file type,
        # this workflow included, counts as code and cannot switch itself off.
        # Every action is SHA-pinned; this one's tags were repointed (CVE-2025-30066).
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        continue-on-error: true
        with:
          files_ignore: |
            **/*.md
            LICENSE

      - name: Decide whether this run touches code
        id: changes
        # Fails open: only a pull request whose changed files were all ignored
        # skips. A broken changed-files step, a dispatch or a push runs in full.
        env:
          ANY_CHANGED: ${{ steps.changed.outputs.any_changed }}
          OUTCOME: ${{ steps.changed.outcome }}
        run: |
          code=true
          if [ "$OUTCOME" = success ] && [ "$ANY_CHANGED" = false ] &&
            [ "${{ github.event_name }}" = pull_request ]; then
            code=false
          fi
          echo "touches code: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'

      - name: Renderer tests
        if: steps.changes.outputs.code == 'true'
        # A glob, not `tests/`: Node 24 reads a bare directory as a test file.
        # Pillow is for tests/readme-gifs.test.js.
        run: |
          pip install pillow
          node --test tests/*.test.js

  # Own job: Windows cannot run the shfmt/shellcheck/apt path `checks` uses.
  # Clippy always runs — a path gate would miss `not(unix)` arms outside the list.
  # Tests only on the path list below, the `windows` label, or non-PR events.
  windows:
    if: github.event.action != 'labeled' || github.event.label.name == 'windows'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Find what this run changed
        id: changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        continue-on-error: true
        with:
          files: |
            src-tauri/src/main.rs
            src-tauri/src/platform.rs
            src-tauri/src/platform/windows/**
            src-tauri/tests/windows_subsystem.rs
            src-tauri/src/secrets.rs
            src-tauri/src/consent.rs
            src-tauri/src/login_item.rs
            crates/core/src/sensing.rs
            src-tauri/Cargo.toml
            crates/core/Cargo.toml
            Cargo.toml
            Cargo.lock
            .github/workflows/tests.yml

      - name: Decide whether this run should test
        id: gate
        # Fail open if changed-files errors. `windows` label forces tests on.
        shell: pwsh
        env:
          ANY_CHANGED: ${{ steps.changed.outputs.any_changed }}
          OUTCOME: ${{ steps.changed.outcome }}
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          $run_tests = $true
          if ($env:OUTCOME -eq "success" -and $env:ANY_CHANGED -eq "false" -and `
              $env:EVENT -eq "pull_request" -and -not ($env:LABELS -like '*windows*')) {
            $run_tests = $false
          }
          Write-Host "run tests: $run_tests"
          "run_tests=$run_tests" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .
          key: windows-latest
          # Same reason as the `checks` job above.
          cache-on-failure: true

      - name: Clippy the workspace for Windows
        # --all-targets: also type-check test modules where many `not(unix)` arms live.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        # bash, not the default pwsh, which takes the last command's exit code
        # and let a passing --doc hide a failed --all-targets.
        if: steps.gate.outputs.run_tests == 'true'
        shell: bash
        run: |
          cargo test --workspace --all-targets
          cargo test --workspace --doc

      - name: The exe a release build links has no console
        # Debug assertions off is the switch `windows_subsystem` reads, at the
        # cost of rebuilding the one crate rather than a full release build.
        if: steps.gate.outputs.run_tests == 'true'
        run: cargo test -p fidget --test windows_subsystem --config 'profile.dev.package.fidget.debug-assertions=false'
