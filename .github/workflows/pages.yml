name: Pages

# The site is an allowlist, not `docs/`, which also holds notes and agent
# instructions. Assemble names each file or a generator that picks its own
# files (ADR-0011).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The download buttons follow a published release once Release has
  # uploaded its bundles. Unlike `release`, this runs on `main`, which the
  # `github-pages` environment allows.
  workflow_run:
    workflows: [Release]
    types: [completed]

# `build` runs pull request code; only `deploy` gets the Pages token.
permissions:
  contents: read

jobs:
  # Split out so a pull request catches a broken site before `main` does.
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'release' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The generators need tomllib (3.11+).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # With no Latest release, or no answer, the buttons link the Releases
      # page, and the What's new strip is absent, rather than fail the build.
      - name: Read the Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view -R "$GITHUB_REPOSITORY" --json tagName,assets,body > release.json || {
            rm -f release.json
            echo "::warning::No Latest release read, so the download buttons link /releases/latest and the What's new strip is absent"
          }

      - name: Assemble the site
        # One script, so the tests build the site this step deploys.
        run: scripts/assemble-site.sh _site release.json

      - name: Verify nothing but a page or its art reached _site
        # What the allowlist keeps off the web is Markdown, so an extension
        # check catches a generator that walks too far.
        run: |
          stray=$(find _site -type f ! \( -name '*.html' -o -name '*.css' \
            -o -name '*.js' -o -name '*.png' -o -name '*.svg' -o -name '*.jpg' -o -name '*.webp' \))
          if [ -n "$stray" ]; then
            echo "not publishable, and _site holds it:"
            echo "$stray"
            exit 1
          fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Runs on pull requests too: packaging rejects what `find` misses, such
      # as a symlink out of the tree.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # Skipped on pull requests, which keeps forks away from `github-pages`.
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Never cancel a deploy in flight: it can leave a half-uploaded site.
    # Job-scoped so a pull request's build never queues behind one.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
