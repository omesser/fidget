name: agent-security-scanner surfaces

# Manual dog-food of glance-labs/agent-security-scanner surfaces against the
# fidget ref picked in the Run workflow dialog. Releases lag main, so the
# scanner is built from scanner_ref. Logs are public: no evidence is requested.

on:
  workflow_dispatch:
    inputs:
      scanner_ref:
        description: glance-labs/agent-security-scanner ref to build (branch, tag, or SHA)
        type: string
        required: false
        default: main

permissions:
  contents: read
  security-events: write # upload-sarif to GitHub code scanning

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.scanner_ref }}
  cancel-in-progress: true

jobs:
  surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require SCANNER_TOKEN
        env:
          SCANNER_TOKEN: ${{ secrets.SCANNER_TOKEN }}
        run: |
          if [ -z "$SCANNER_TOKEN" ]; then
            echo '::error::SCANNER_TOKEN is not set. Add a fine-grained PAT with contents:read on glance-labs/agent-security-scanner as the SCANNER_TOKEN repository secret.'
            exit 1
          fi

      - name: Check out fidget
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fidget
          persist-credentials: false

      - name: Check out the scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: glance-labs/agent-security-scanner
          ref: ${{ inputs.scanner_ref }}
          token: ${{ secrets.SCANNER_TOKEN }}
          path: agent-security-scanner
          persist-credentials: false

      - name: Set up Node
        # The scanner's CI pins 22; it has no engines field or .nvmrc.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Build the scanner
        working-directory: agent-security-scanner
        run: |
          npm ci
          npm run build

      - name: Run surfaces
        id: scan
        # Exit 1 is findings at or above --fail-on (default high). This run
        # is observational, so 0 and 1 succeed; 2 (incomplete or tool error)
        # and any other code (a crash) still fail the job. One run writes
        # SARIF, with paths relative to the fidget checkout (the working
        # directory); warnings and baselined lines still go to the log.
        working-directory: fidget
        env:
          SCANNER_BIN: ${{ github.workspace }}/agent-security-scanner/dist/cli.js
          FIDGET_DIR: ${{ github.workspace }}/fidget
          SARIF_FILE: ${{ runner.temp }}/glance-surfaces.sarif
        run: |
          set +e
          node "$SCANNER_BIN" surfaces --dir "$FIDGET_DIR" --sarif > "$SARIF_FILE"
          status=$?
          set -e
          echo "code=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ] || [ "$status" -eq 1 ]; then
            echo "surfaces exited $status (0 = clean, 1 = findings). The job does not fail on findings."
            exit 0
          fi
          echo "::error::surfaces exited $status (2 = incomplete or tool error; anything else is a crash)."
          exit "$status"

      - name: Upload SARIF to code scanning
        # Only after a complete scan. The scanner's README says not to upload
        # after exit 2: a partial scan closes the alerts for every file it
        # skipped. A failed scan step skips this step.
        if: steps.scan.outputs.code == '0' || steps.scan.outputs.code == '1'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/glance-surfaces.sarif
          checkout_path: ${{ github.workspace }}/fidget
