# Baseline only the shellcheck notes already present in these files.
# The same SC code in any other workflow still fails the job.
paths:
  .github/workflows/e2e-linux.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC2015:.+'
  .github/workflows/e2e-macos.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC2015:.+'
      - 'shellcheck reported issue in this script: SC2016:.+'
  .github/workflows/mattpocock-skills-sync.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC2016:.+'
  .github/workflows/pstack-sync.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC2016:.+'
  .github/workflows/tests.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC2016:.+'
      - 'shellcheck reported issue in this script: SC2024:.+'
