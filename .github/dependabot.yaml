version: 2

updates:
  # Version updates wait 7 days after a release, not GitHub's implicit 3, so
  # a compromised version yanked within the week never reaches a pull request.
  # Security updates skip the wait.

  # The workspace root holds Cargo.lock; src-tauri has none.
  - directory: "/"
    package-ecosystem: "cargo"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "maintenance"
    ignore:
      # RUSTSEC VariantStrIter unsoundness, fixed in glib 0.20, which the
      # tauri -> gtk 0.18 line cannot take. We call no glib API. The bound
      # lifts the ignore once 0.20 is reachable. See #37.
      - dependency-name: "glib"
        versions: ["< 0.20"]
      # gtk 0.18 and gdk-pixbuf must share one glib. A 0.19+ bump of
      # either splits it, and the Linux taskbar icon stops compiling.
      # Lift both when tauri leaves this line (#1407).
      - dependency-name: "gdk-pixbuf"
        versions: [">= 0.19"]
      - dependency-name: "gtk"
        versions: [">= 0.19"]

  - directory: "/"
    package-ecosystem: "github-actions"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "maintenance"

  # marked is vendored as src/vendor/marked.esm.js. A marked bump must
  # re-vendor that file per src/vendor/README.md, or the test that checks
  # package.json against the vendored copy fails.
  - directory: "/"
    package-ecosystem: "npm"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "maintenance"

  - directory: "/scripts"
    package-ecosystem: "pip"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "maintenance"

  - directory: "/"
    package-ecosystem: "pre-commit"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "maintenance"
